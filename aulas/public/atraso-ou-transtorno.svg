<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Fluxo de decisao entre atraso e transtorno: identificado o atraso, oferece-se estimulacao dirigida por tempo suficiente; se a crianca alcanca os pares, era atraso; se o deficit persiste apesar da intervencao, investiga-se transtorno">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
    .wt { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #f4f2ea; }
  </style>

  <text class="kk" x="16" y="22">O TEMPO É PARTE DO MÉTODO</text>

  <rect x="16" y="112" width="176" height="76" fill="#fbfaf5" stroke="#c3bfb0"/>
  <text class="tt" x="104" y="142" text-anchor="middle">Atraso identificado</text>
  <text class="sb" x="104" y="164" text-anchor="middle">uma área não acompanha</text>
  <text class="sb" x="104" y="180" text-anchor="middle">as outras</text>
  <path d="M 192 150 L 226 150" stroke="#947b2f" stroke-width="2.5"/>
  <path d="M 234 150 l -9 -6 v 12 z" fill="#947b2f"/>

  <rect x="240" y="100" width="212" height="100" fill="#242258"/>
  <text class="wt" x="346" y="132" text-anchor="middle">Estimulação dirigida</text>
  <text x="346" y="154" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d9c176">à dificuldade encontrada</text>
  <text x="346" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f4f2ea">por tempo suficiente</text>

  <path d="M 452 150 L 486 150 L 486 74 L 520 74" stroke="#947b2f" stroke-width="2.5" fill="none"/>
  <path d="M 528 74 l -9 -6 v 12 z" fill="#947b2f"/>
  <path d="M 452 150 L 486 150 L 486 240 L 520 240" stroke="#947b2f" stroke-width="2.5" fill="none"/>
  <path d="M 528 240 l -9 -6 v 12 z" fill="#947b2f"/>

  <rect x="534" y="36" width="330" height="76" fill="#e3ece4" stroke="#c3bfb0"/>
  <text class="tt" x="552" y="64">Alcança os pares</text>
  <text class="sb" x="552" y="86">era <tspan fill="#2c6b4f" font-size="14">atraso</tspan> — a trajetória se reorganiza</text>
  <text class="sb" x="552" y="104">quando o ambiente entrega o que faltava</text>

  <rect x="534" y="202" width="330" height="76" fill="#f2e6dd" stroke="#c3bfb0"/>
  <text class="tt" x="552" y="230">Persiste apesar da intervenção</text>
  <text class="sb" x="552" y="252">investigar <tspan fill="#96322c" font-size="14">transtorno</tspan> — o déficit não é</text>
  <text class="sb" x="552" y="270">falta de oportunidade</text>

  <rect x="16" y="292" width="848" height="30" fill="#eae7dd" stroke="#c3bfb0"/>
  <text class="sb" x="30" y="312" font-size="13.5">O DSM-5 escreve essa exigência em pelo menos um lugar: o transtorno específico da aprendizagem só é diagnosticado quando as dificuldades persistem por <tspan fill="#242258">ao menos seis meses</tspan> apesar de intervenções dirigidas.</text>
</svg>
