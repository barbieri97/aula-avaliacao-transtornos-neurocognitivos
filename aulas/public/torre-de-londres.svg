<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="A tarefa da Torre de Londres: uma configuracao inicial de tres bolas em tres hastes deve ser transformada na configuracao-alvo com o menor numero possivel de movimentos">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">A TAREFA</text>

  <!-- painel estado inicial -->
  <rect x="16" y="40" width="330" height="212" fill="#fbfaf5" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="66">Estado inicial</text>
  <text class="sb" x="32" y="86">a criança move uma bola por clique</text>
  <g>
    <rect x="60" y="216" width="250" height="8" fill="#c3bfb0"/>
    <rect x="96" y="126" width="8" height="90" fill="#c3bfb0"/>
    <rect x="181" y="156" width="8" height="60" fill="#c3bfb0"/>
    <rect x="266" y="186" width="8" height="30" fill="#c3bfb0"/>
    <circle cx="100" cy="202" r="14" fill="#242258"/>
    <circle cx="100" cy="174" r="14" fill="#947b2f"/>
    <circle cx="185" cy="202" r="14" fill="#96322c"/>
  </g>

  <!-- seta -->
  <path d="M 362 146 L 404 146" stroke="#947b2f" stroke-width="3"/>
  <path d="M 414 146 l -11 -7 v 14 z" fill="#947b2f"/>
  <text class="sb" x="388" y="132" text-anchor="middle" fill="#6f5a1f">o menor</text>
  <text class="sb" x="388" y="176" text-anchor="middle" fill="#6f5a1f">número de</text>
  <text class="sb" x="388" y="194" text-anchor="middle" fill="#6f5a1f">movimentos</text>

  <!-- painel alvo -->
  <rect x="430" y="40" width="330" height="212" fill="#e7e7f1" stroke="#c3bfb0"/>
  <text class="tt" x="446" y="66">Configuração-alvo</text>
  <text class="sb" x="446" y="86">fica visível à direita o tempo todo</text>
  <g>
    <rect x="474" y="216" width="250" height="8" fill="#c3bfb0"/>
    <rect x="510" y="126" width="8" height="90" fill="#c3bfb0"/>
    <rect x="595" y="156" width="8" height="60" fill="#c3bfb0"/>
    <rect x="680" y="186" width="8" height="30" fill="#c3bfb0"/>
    <circle cx="514" cy="202" r="14" fill="#96322c"/>
    <circle cx="599" cy="202" r="14" fill="#947b2f"/>
    <circle cx="684" cy="202" r="14" fill="#242258"/>
  </g>

  <!-- coluna direita -->
  <rect x="776" y="40" width="88" height="212" fill="#242258"/>
  <text x="820" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f4f2ea">19</text>
  <text x="820" y="96" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d9c176">problemas</text>
  <text x="820" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f4f2ea">3</text>
  <text x="820" y="160" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d9c176">tentativas</text>
  <text x="820" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#f4f2ea">57</text>
  <text x="820" y="224" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d9c176">pontos, no</text>
  <text x="820" y="240" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#d9c176">máximo</text>

  <rect x="16" y="266" width="848" height="46" fill="#eae7dd" stroke="#c3bfb0"/>
  <text class="sb" x="32" y="288" font-size="13.5">Acertar na primeira tentativa vale 3 pontos; na segunda, 2; na terceira, 1. As soluções mínimas vão de <tspan fill="#242258">três a nove movimentos</tspan>.</text>
  <text class="sb" x="32" y="306" font-size="13.5">Quem resolve por tentativa e erro chega ao objetivo — mas gasta movimentos. É essa diferença que o escore mede.</text>
</svg>
