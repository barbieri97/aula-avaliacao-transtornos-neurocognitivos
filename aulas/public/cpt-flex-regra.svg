<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="A regra do CPT-Flex: com as figuras azuis responde-se a triangulo, circulo e X e inibe-se o quadrado; quando as figuras ficam laranjas a regra inverte e so o quadrado exige resposta">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
    .ok { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #2c6b4f; }
    .no { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #96322c; }
  </style>

  <text class="kk" x="16" y="22">A REGRA MUDA NO MEIO DA TAREFA</text>

  <!-- bloco azul -->
  <rect x="16" y="40" width="410" height="150" fill="#e7e7f1" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="64">Blocos não flex — figuras azuis</text>
  <text class="sb" x="32" y="84">responda a tudo, exceto ao quadrado</text>
  <g fill="#242258">
    <polygon points="70,140 54,166 86,166"/>
    <circle cx="150" cy="153" r="16"/>
    <text x="222" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#242258">X</text>
    <rect x="290" y="137" width="32" height="32"/>
  </g>
  <text class="ok" x="70" y="184" text-anchor="middle">responde</text>
  <text class="ok" x="150" y="184" text-anchor="middle">responde</text>
  <text class="ok" x="222" y="184" text-anchor="middle">responde</text>
  <text class="no" x="306" y="184" text-anchor="middle">inibe</text>

  <!-- bloco laranja -->
  <rect x="454" y="40" width="410" height="150" fill="#f1e9d6" stroke="#c3bfb0"/>
  <text class="tt" x="470" y="64">Blocos flex — figuras laranjas</text>
  <text class="sb" x="470" y="84">inverta: só o quadrado pede resposta</text>
  <g fill="#a3651b">
    <polygon points="508,140 492,166 524,166"/>
    <circle cx="588" cy="153" r="16"/>
    <text x="660" y="164" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#a3651b">X</text>
    <rect x="728" y="137" width="32" height="32"/>
  </g>
  <text class="no" x="508" y="184" text-anchor="middle">inibe</text>
  <text class="no" x="588" y="184" text-anchor="middle">inibe</text>
  <text class="no" x="660" y="184" text-anchor="middle">inibe</text>
  <text class="ok" x="744" y="184" text-anchor="middle">responde</text>

  <!-- fita de blocos -->
  <text class="sb" x="16" y="220">200 estímulos, sete blocos, intervalos de 1, 2 ou 4 segundos:</text>
  <g>
    <rect x="16"  y="230" width="118" height="26" fill="#242258"/>
    <rect x="138" y="230" width="118" height="26" fill="#a3651b"/>
    <rect x="260" y="230" width="118" height="26" fill="#242258"/>
    <rect x="382" y="230" width="118" height="26" fill="#a3651b"/>
    <rect x="504" y="230" width="118" height="26" fill="#242258"/>
    <rect x="626" y="230" width="118" height="26" fill="#a3651b"/>
    <rect x="748" y="230" width="116" height="26" fill="#242258"/>
  </g>
  <text class="sb" x="16" y="274" font-size="12.5">A troca acontece a cada bloco. Errar logo depois da virada é <tspan fill="#242258">erro perseverativo</tspan> — a medida de flexibilidade.</text>

  <rect x="16" y="288" width="848" height="34" fill="#eae7dd" stroke="#c3bfb0"/>
  <text class="sb" x="32" y="310" font-size="13.5">Só se entra na tarefa depois de acertar <tspan fill="#242258">80% do treino</tspan>: um desempenho ruim no teste não pode ser confundido com não ter entendido a instrução.</text>
</svg>
