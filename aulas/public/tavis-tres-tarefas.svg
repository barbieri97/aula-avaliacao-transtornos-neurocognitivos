<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="As tres tarefas do TAVIS-4: seletividade, em que se responde a um alvo entre distratores; alternancia, em que o alvo muda de parametro; e sustentacao, tarefa longa e monotona de deteccao">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
    .nu { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">TRÊS TAREFAS, TRÊS DIMENSÕES</text>

  <!-- 1 seletividade -->
  <rect x="16" y="40" width="272" height="216" fill="#e7e7f1" stroke="#c3bfb0"/>
  <text class="nu" x="32" y="64">TAREFA 1</text>
  <text class="tt" x="32" y="88">Seletividade</text>
  <g>
    <circle cx="60" cy="124" r="11" fill="#c3bfb0"/><circle cx="104" cy="124" r="11" fill="#c3bfb0"/>
    <circle cx="148" cy="124" r="11" fill="#242258"/><circle cx="192" cy="124" r="11" fill="#c3bfb0"/>
    <circle cx="236" cy="124" r="11" fill="#c3bfb0"/>
    <circle cx="60" cy="160" r="11" fill="#c3bfb0"/><circle cx="104" cy="160" r="11" fill="#c3bfb0"/>
    <circle cx="148" cy="160" r="11" fill="#c3bfb0"/><circle cx="192" cy="160" r="11" fill="#242258"/>
    <circle cx="236" cy="160" r="11" fill="#c3bfb0"/>
  </g>
  <text class="sb" x="32" y="196">responder só ao alvo, entre distratores</text>
  <text class="sb" x="32" y="216">exige rastreamento e discriminação visual</text>
  <text class="sb" x="32" y="240" fill="#6f5a1f">um resultado ruim aqui contamina as outras</text>

  <!-- 2 alternancia -->
  <rect x="304" y="40" width="272" height="216" fill="#f1e9d6" stroke="#c3bfb0"/>
  <text class="nu" x="320" y="64">TAREFA 2</text>
  <text class="tt" x="320" y="88">Alternância</text>
  <g>
    <rect x="332" y="112" width="100" height="26" fill="#242258"/>
    <text x="382" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f4f2ea">igual?</text>
    <path d="M 442 125 L 462 125" stroke="#947b2f" stroke-width="2"/><path d="M 470 125 l -9 -6 v 12 z" fill="#947b2f"/>
    <rect x="474" y="112" width="88" height="26" fill="#a3651b"/>
    <text x="518" y="131" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f4f2ea">diferente?</text>
    <path d="M 442 160 L 462 160" stroke="#947b2f" stroke-width="2"/><path d="M 434 160 l 9 -6 v 12 z" fill="#947b2f"/>
    <text class="sb" x="320" y="165">e de novo</text>
  </g>
  <text class="sb" x="320" y="196">alternar entre dois parâmetros</text>
  <text class="sb" x="320" y="216">igual/diferente nas crianças, cor/forma</text>
  <text class="sb" x="320" y="234">nos adolescentes</text>
  <text class="sb" x="320" y="252" fill="#6f5a1f">mudar o foco é a demanda central</text>

  <!-- 3 sustentacao -->
  <rect x="592" y="40" width="272" height="216" fill="#e3ece4" stroke="#c3bfb0"/>
  <text class="nu" x="608" y="64">TAREFA 3</text>
  <text class="tt" x="608" y="88">Sustentação</text>
  <g>
    <line x1="608" y1="140" x2="848" y2="140" stroke="#c3bfb0" stroke-width="2"/>
    <circle cx="626" cy="140" r="8" fill="#242258"/>
    <circle cx="694" cy="140" r="8" fill="#242258"/>
    <circle cx="782" cy="140" r="8" fill="#242258"/>
    <text class="sb" x="608" y="166">6 min (crianças) · 10 min (adolescentes)</text>
  </g>
  <text class="sb" x="608" y="196">estímulos raros, espaçados, monótonos</text>
  <text class="sb" x="608" y="216">responder rápido, sem perder o desempenho</text>
  <text class="sb" x="608" y="240" fill="#6f5a1f">é onde a queda ao longo do tempo aparece</text>

  <rect x="16" y="270" width="848" height="46" fill="#242258"/>
  <text x="32" y="292" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f4f2ea">Três medidas, nas três tarefas: <tspan fill="#d9c176">tempo médio de reação</tspan>, <tspan fill="#d9c176">erros por omissão</tspan> (o alvo passou e não houve resposta)</text>
  <text x="32" y="310" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f4f2ea">e <tspan fill="#d9c176">erros por ação</tspan> (respondeu sem alvo na tela). Normas por idade <tspan fill="#d9c176">e</tspan> por sexo.</text>
</svg>
