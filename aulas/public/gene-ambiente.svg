<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="Mesma carga genetica, dois ambientes: em ambiente com acesso, intervencao e escola que acomoda, a trajetoria se aproxima do esperado; em ambiente sem acesso, com estresse cronico e exigencias rigidas, a trajetoria se afasta">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">MESMA CARGA, DUAS TRAJETÓRIAS</text>

  <rect x="16" y="120" width="150" height="82" fill="#242258"/>
  <text x="91" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f4f2ea">Vulnerabilidade</text>
  <text x="91" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f4f2ea">genética</text>
  <text x="91" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#d9c176">poligênica, comum</text>

  <line x1="200" y1="46" x2="200" y2="276" stroke="#ddd9cb"/>
  <line x1="200" y1="161" x2="860" y2="161" stroke="#ddd9cb" stroke-dasharray="4 5"/>
  <text class="sb" x="856" y="155" text-anchor="end" font-size="12">trajetória esperada</text>

  <path d="M 200 161 C 320 152 430 128 560 106 C 660 90 760 82 852 78" fill="none" stroke="#2c6b4f" stroke-width="3"/>
  <circle cx="852" cy="78" r="6" fill="#2c6b4f"/>
  <rect x="230" y="42" width="360" height="46" fill="#e3ece4" stroke="#c3bfb0"/>
  <text class="tt" x="244" y="62">Acesso, intervenção precoce, escola que acomoda</text>
  <text class="sb" x="244" y="80">sintomas menos intensos · mais função no dia a dia</text>

  <path d="M 200 161 C 320 174 430 202 560 226 C 660 244 760 254 852 260" fill="none" stroke="#96322c" stroke-width="3"/>
  <circle cx="852" cy="260" r="6" fill="#96322c"/>
  <rect x="230" y="232" width="360" height="46" fill="#f2e6dd" stroke="#c3bfb0"/>
  <text class="tt" x="244" y="252">Sem acesso, estresse crônico, exigência rígida</text>
  <text class="sb" x="244" y="270">sintomas mais intensos · mais prejuízo funcional</text>

  <text class="sb" x="16" y="310" font-size="13.5">O ambiente não causa nem cura o transtorno. Ele desloca a trajetória — e é sobre a trajetória, não sobre o gene, que a intervenção age.</text>
</svg>
