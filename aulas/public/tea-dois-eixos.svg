<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="Estrutura do diagnostico de TEA no DSM-5: o criterio A exige os tres deficits de comunicacao social, o criterio B exige ao menos dois dos quatro padroes restritos e repetitivos, e os criterios C, D e E enquadram inicio precoce, prejuizo atual e exclusao">
  <style>
    .h  { font-family: Helvetica, Arial, sans-serif; font-size: 17px; fill: #f4f2ea; }
    .i  { font-family: Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">DOIS EIXOS, UMA BASE</text>

  <!-- criterio A -->
  <rect x="16" y="40" width="410" height="34" fill="#242258"/>
  <text class="h" x="32" y="63">A · Comunicação e interação social</text>
  <text x="410" y="63" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d9c176">os três</text>
  <g>
    <rect x="16" y="80" width="410" height="40" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="i" x="32" y="98">A1 · reciprocidade socioemocional</text>
    <text class="sb" x="32" y="114">iniciar e responder à interação, compartilhar interesse e afeto</text>
    <rect x="16" y="124" width="410" height="40" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="i" x="32" y="142">A2 · comunicação não verbal</text>
    <text class="sb" x="32" y="158">contato visual, gestos, expressão facial, linguagem corporal</text>
    <rect x="16" y="168" width="410" height="40" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="i" x="32" y="186">A3 · desenvolver e manter relações</text>
    <text class="sb" x="32" y="202">ajustar-se ao contexto, brincar de faz de conta, fazer amigos</text>
  </g>

  <!-- criterio B -->
  <rect x="450" y="40" width="414" height="34" fill="#242258"/>
  <text class="h" x="466" y="63">B · Padrões restritos e repetitivos</text>
  <text x="848" y="63" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d9c176">dois dos quatro</text>
  <g>
    <rect x="450" y="80" width="414" height="30" fill="#f1e9d6" stroke="#c3bfb0"/>
    <text class="i" x="466" y="99">B1 · movimentos, fala ou uso de objetos estereotipados</text>
    <rect x="450" y="114" width="414" height="30" fill="#f1e9d6" stroke="#c3bfb0"/>
    <text class="i" x="466" y="133">B2 · insistência nas mesmas coisas, rotinas e rituais</text>
    <rect x="450" y="148" width="414" height="30" fill="#f1e9d6" stroke="#c3bfb0"/>
    <text class="i" x="466" y="167">B3 · interesses fixos, anormais em intensidade ou foco</text>
    <rect x="450" y="182" width="414" height="30" fill="#f1e9d6" stroke="#c3bfb0"/>
    <text class="i" x="466" y="201">B4 · hiper ou hiporreatividade sensorial</text>
  </g>

  <!-- base C D E -->
  <path d="M 220 208 L 220 232" stroke="#947b2f" stroke-width="2.5"/>
  <path d="M 657 212 L 657 232" stroke="#947b2f" stroke-width="2.5"/>
  <rect x="16" y="236" width="848" height="60" fill="#fbfaf5" stroke="#c3bfb0"/>
  <text class="i" x="32" y="258">C · presentes <tspan fill="#6f5a1f">precocemente no desenvolvimento</tspan> — ainda que só apareçam quando a demanda social cresce</text>
  <text class="i" x="32" y="278">D · causam <tspan fill="#6f5a1f">prejuízo clinicamente significativo</tspan> no presente &#160;·&#160; E · não são melhor explicados por deficiência intelectual ou atraso global</text>

  <rect x="16" y="306" width="848" height="34" fill="#eae7dd" stroke="#c3bfb0"/>
  <text class="sb" x="30" y="327" font-size="13.5">A gravidade é registrada em <tspan fill="#242258">separado</tspan> para cada eixo, em três níveis de apoio — e o quadro ainda recebe especificadores de linguagem, funcionamento intelectual, condição associada e catatonia.</text>
</svg>
