<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="Quatro trilhas paralelas do desenvolvimento infantil — motor, linguagem, cognitivo e socioemocional — avançando entre 12 e 36 meses, com uma delas atrasada em relação às outras">
  <style>
    .area{ font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #242258; }
    .mk  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #63628a; }
    .ax  { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #6f5a1f; }
    .kk  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">QUATRO TRILHAS QUE CORREM JUNTAS</text>

  <g class="ax" text-anchor="middle">
    <text x="266" y="52">12 meses</text>
    <text x="426" y="52">18 meses</text>
    <text x="586" y="52">24 meses</text>
    <text x="756" y="52">36 meses</text>
  </g>
  <g stroke="#ddd9cb" stroke-width="1">
    <line x1="266" y1="62" x2="266" y2="278"/>
    <line x1="426" y1="62" x2="426" y2="278"/>
    <line x1="586" y1="62" x2="586" y2="278"/>
    <line x1="756" y1="62" x2="756" y2="278"/>
  </g>

  <!-- Motor -->
  <text class="area" x="16" y="90">Motor</text>
  <line x1="200" y1="96" x2="812" y2="96" stroke="#c3bfb0" stroke-width="2"/>
  <g fill="#242258"><circle cx="266" cy="96" r="7"/><circle cx="426" cy="96" r="7"/><circle cx="586" cy="96" r="7"/><circle cx="756" cy="96" r="7"/></g>
  <g class="mk" text-anchor="middle"><text x="266" y="118">anda apoiado</text><text x="426" y="118">anda sozinho</text><text x="586" y="118">chuta a bola</text><text x="756" y="118">usa o garfo</text></g>

  <!-- Linguagem: a trilha atrasada -->
  <text class="area" x="16" y="152" fill="#96322c">Linguagem</text>
  <line x1="200" y1="158" x2="586" y2="158" stroke="#96322c" stroke-width="2"/>
  <line x1="586" y1="158" x2="812" y2="158" stroke="#96322c" stroke-width="2" stroke-dasharray="5 6"/>
  <g fill="#96322c"><circle cx="266" cy="158" r="7"/><circle cx="426" cy="158" r="7"/></g>
  <g fill="#fbfaf5" stroke="#96322c" stroke-width="2"><circle cx="586" cy="158" r="7"/><circle cx="756" cy="158" r="7"/></g>
  <g class="mk" text-anchor="middle" fill="#96322c"><text x="266" y="180">diz “mamã”</text><text x="426" y="180">três palavras</text><text x="586" y="180">junta duas palavras</text><text x="756" y="180">conversa em turnos</text></g>

  <!-- Cognitivo -->
  <text class="area" x="16" y="214">Cognitivo</text>
  <line x1="200" y1="220" x2="812" y2="220" stroke="#c3bfb0" stroke-width="2"/>
  <g fill="#242258"><circle cx="266" cy="220" r="7"/><circle cx="426" cy="220" r="7"/><circle cx="586" cy="220" r="7"/><circle cx="756" cy="220" r="7"/></g>
  <g class="mk" text-anchor="middle"><text x="266" y="242">procura o escondido</text><text x="426" y="242">imita tarefa da casa</text><text x="586" y="242">usa dois brinquedos</text><text x="756" y="242">copia um círculo</text></g>

  <!-- Socioemocional -->
  <text class="area" x="16" y="276">Socioemocional</text>
  <line x1="200" y1="282" x2="812" y2="282" stroke="#c3bfb0" stroke-width="2"/>
  <g fill="#242258"><circle cx="266" cy="282" r="7"/><circle cx="426" cy="282" r="7"/><circle cx="586" cy="282" r="7"/><circle cx="756" cy="282" r="7"/></g>
  <g class="mk" text-anchor="middle"><text x="266" y="304">brinca de esconder</text><text x="426" y="304">aponta para mostrar</text><text x="586" y="304">olha o seu rosto</text><text x="756" y="304">junta-se a outras</text></g>

  <rect x="16" y="316" width="840" height="22" fill="none"/>
  <circle cx="26" cy="326" r="6" fill="#fbfaf5" stroke="#96322c" stroke-width="2"/>
  <text class="mk" x="40" y="331" font-size="13">Uma trilha que não acompanha as outras é motivo de encaminhamento — ainda não é diagnóstico.</text>
</svg>
