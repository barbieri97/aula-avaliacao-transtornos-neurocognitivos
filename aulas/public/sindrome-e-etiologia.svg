<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 291" width="860" height="291" role="img" aria-label="A síndrome de transtorno neurocognitivo no centro e as etiologias possíveis em ramos, com o par provável e possível">
  <style>
    .cx  { font-family: Helvetica, Arial, sans-serif; font-size: 20px; fill: #f4f2ea; }
    .cxs { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #d9c176; }
    .rot { font-family: Helvetica, Arial, sans-serif; font-size: 16px; fill: #242258; }
    .sub { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #63628a; }
    .chip{ font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #242258; }
  </style>

  <!-- o tronco: primeiro a síndrome -->
  <rect x="10" y="91" width="216" height="94" fill="#242258"/>
  <text class="cx"  x="118" y="127" text-anchor="middle">Síndrome</text>
  <text class="cxs" x="118" y="155" text-anchor="middle">TNC leve ou TNC maior</text>
  <text class="cxs" x="118" y="173" text-anchor="middle">critérios A a D</text>

  <path d="M 226 138 L 282 138" stroke="#947b2f" stroke-width="2.5"/>
  <path d="M 282 23 L 282 253" stroke="#947b2f" stroke-width="2.5"/>

  <!-- os ramos: só depois a causa -->
  <g>
    <path d="M 282 23 L 320 23" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="6" width="234" height="34" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="28">Doença de Alzheimer</text>

    <path d="M 282 69 L 320 69" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="52" width="234" height="34" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="74">Doença vascular</text>

    <path d="M 282 115 L 320 115" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="98" width="234" height="34" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="120">Degeneração frontotemporal</text>

    <path d="M 282 161 L 320 161" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="144" width="234" height="34" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="166">Doença com corpos de Lewy</text>

    <path d="M 282 207 L 320 207" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="190" width="234" height="34" fill="#e7e7f1" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="212">Doença do príon</text>

    <path d="M 282 253 L 320 253" stroke="#947b2f" stroke-width="1.5"/>
    <rect x="320" y="236" width="234" height="34" fill="#eae7dd" stroke="#c3bfb0"/>
    <text class="rot" x="334" y="258" font-size="15">Parkinson · TCE · HIV · outras</text>
  </g>

  <!-- e o grau de certeza -->
  <path d="M 554 23 L 596 23 L 596 253 L 554 253" fill="none" stroke="#c3bfb0" stroke-width="1.5"/>
  <path d="M 596 138 L 634 138" stroke="#947b2f" stroke-width="2.5"/>
  <path d="M 642 138 l -9 -6 v 12 z" fill="#947b2f"/>

  <rect x="646" y="66" width="204" height="70" fill="#e3ece4" stroke="#2c6b4f" stroke-width="1.5"/>
  <text class="chip" x="748" y="92" text-anchor="middle">provável</text>
  <text class="sub"  x="748" y="112" text-anchor="middle">genética, imagem</text>
  <text class="sub"  x="748" y="128" text-anchor="middle">ou perfil típico</text>

  <rect x="646" y="146" width="204" height="70" fill="#f1e9d6" stroke="#a3651b" stroke-width="1.5"/>
  <text class="chip" x="748" y="172" text-anchor="middle">possível</text>
  <text class="sub"  x="748" y="192" text-anchor="middle">clínica compatível,</text>
  <text class="sub"  x="748" y="208" text-anchor="middle">sem confirmação</text>
</svg>
