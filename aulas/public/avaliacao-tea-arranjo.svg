<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Arranjo da avaliacao do TEA: historia com multiplos informantes, observacao direta do comportamento, medidas padronizadas de cognicao e linguagem e medida de funcionamento adaptativo convergem para uma hipotese diagnostica clinica">
  <style>
    .tt { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #242258; }
    .sb { font-family: Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #63628a; }
    .kk { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #6f5a1f; letter-spacing: 1.4px; }
  </style>

  <text class="kk" x="16" y="22">QUATRO FONTES, UMA CONCLUSÃO</text>

  <rect x="16" y="42" width="250" height="58" fill="#e7e7f1" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="66">História</text>
  <text class="sb" x="32" y="86">gestação, parto, marcos, regressões</text>

  <rect x="16" y="112" width="250" height="58" fill="#f1e9d6" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="136">Observação direta</text>
  <text class="sb" x="32" y="156">brincadeira, atenção compartilhada</text>

  <rect x="16" y="182" width="250" height="58" fill="#e3ece4" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="206">Medidas padronizadas</text>
  <text class="sb" x="32" y="226">cognição, linguagem, executivas</text>

  <rect x="16" y="252" width="250" height="58" fill="#f2e6dd" stroke="#c3bfb0"/>
  <text class="tt" x="32" y="276">Funcionamento adaptativo</text>
  <text class="sb" x="32" y="296">o que a criança faz sozinha</text>

  <g stroke="#947b2f" stroke-width="2.5" fill="none">
    <path d="M 266 71  C 330 71  350 130 410 158"/>
    <path d="M 266 141 C 330 141 350 150 410 160"/>
    <path d="M 266 211 C 330 211 350 176 410 164"/>
    <path d="M 266 281 C 330 281 350 196 410 168"/>
  </g>
  <path d="M 420 163 l -10 -6 v 12 z" fill="#947b2f"/>

  <rect x="428" y="112" width="220" height="100" fill="#242258"/>
  <text x="538" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f4f2ea">Múltiplos informantes,</text>
  <text x="538" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f4f2ea">múltiplos contextos</text>
  <text x="538" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#d9c176">família · escola · consultório</text>

  <path d="M 648 162 L 686 162" stroke="#947b2f" stroke-width="2.5"/>
  <path d="M 694 162 l -9 -6 v 12 z" fill="#947b2f"/>

  <rect x="700" y="112" width="164" height="100" fill="#fbfaf5" stroke="#242258" stroke-width="2"/>
  <text class="tt" x="782" y="146" text-anchor="middle" font-size="17">Hipótese</text>
  <text class="tt" x="782" y="170" text-anchor="middle" font-size="17">diagnóstica</text>
  <text class="sb" x="782" y="192" text-anchor="middle" fill="#6f5a1f">é clínica, não é um escore</text>
</svg>
